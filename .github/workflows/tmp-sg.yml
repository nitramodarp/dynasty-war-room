name: Tmp SG
on:
  workflow_dispatch: {}
jobs:
  sg:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          B="https://api.statsguyfantasy.com/api/v1"
          r=urllib.request.Request(B+"/players?tep=tep",headers={"User-Agent":"Mozilla/5.0"})
          for p in json.load(urllib.request.urlopen(r,timeout=30))["players"]:
              if "King" in p["name"] or p["name"] in ("Travis Hunter","Kaelon Black"): print("SG",p["name"],p["position"],p["team"],p["age"],p["yearsExperience"],p["value"]["sf_dynasty"],p["rank"]["sf_dynasty"])
          PY
